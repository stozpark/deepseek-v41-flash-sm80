name: audit-minimal-sm80

on:
  push:
    branches: [minimal-sm80]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minimal-cu129-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo docker system prune -af || true
          df -h /

      - name: Verify branch is CUDA 12.9
        run: |
          grep -qx 'OFFICIAL_IMAGE=vllm/vllm-openai:deepseekv41-flash-0909-cu129' VERSION.env
          grep -qx 'CUDA_FAMILY=12.9.1' VERSION.env
          grep -qx 'SIF_NAME=deepseek-v41-flash-sm80-cu129.sif' VERSION.env
          grep -qx 'From: vllm/vllm-openai:deepseekv41-flash-0909-cu129' Singularity.def

      - name: Pull verified official baseline
        run: docker pull vllm/vllm-openai:deepseekv41-flash-0909-cu129

      - name: Build broad audit reference then minimize
        run: |
          set -euxo pipefail
          rm -rf .minimal
          mkdir -p .minimal

          docker run --rm \
            --entrypoint bash \
            -v "$PWD:/work" -w /work \
            vllm/vllm-openai:deepseekv41-flash-0909-cu129 \
            -lc 'set -euxo pipefail; \
              python3 /work/.github/scripts/snapshot_vllm_text.py /work/.minimal/baseline; \
              rm -rf /opt/sm80-overlay; mkdir -p /opt/sm80-overlay; \
              cp -a /work/patches/vendor/vllm /opt/sm80-overlay/vllm; \
              cp /work/patches/apply_overlay.py /opt/sm80-overlay/apply_overlay.py; \
              python3 /opt/sm80-overlay/apply_overlay.py; \
              python3 /work/.github/scripts/snapshot_vllm_text.py /work/.minimal/full'

          python3 .github/scripts/minimize_patched_tree.py \
            .minimal/baseline .minimal/full .minimal/minimal

          python3 .github/scripts/make_patch_bundle.py \
            .minimal/baseline .minimal/minimal .minimal/sm80-cu129-minimal.patch \
            | tee .minimal/minimal-manifest.txt
          sha256sum .minimal/sm80-cu129-minimal.patch \
            | tee .minimal/sm80-cu129-minimal.patch.sha256
          du -h .minimal/sm80-cu129-minimal.patch

      - name: Replay candidate on fresh official image and audit
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint bash \
            -v "$PWD:/work" -w /work \
            vllm/vllm-openai:deepseekv41-flash-0909-cu129 \
            -lc 'set -euxo pipefail; \
              root="$(python3 -c "import pathlib,vllm; print(pathlib.Path(vllm.__file__).resolve().parent)")"; \
              python3 -c "from pathlib import Path; import re; root=Path(\"$root\"); lines=Path(\"/work/.minimal/sm80-cu129-minimal.patch\").read_text().splitlines(); [ (root / m.group(1)).parent.mkdir(parents=True, exist_ok=True) for line in lines if (m := re.match(r\"^\\+\\+\\+ b/(.+)$\", line)) ]"; \
              patch --batch --forward -p1 -d "$root" < /work/.minimal/sm80-cu129-minimal.patch; \
              python3 /work/.github/scripts/audit_official_image.py; \
              SM80_PATCH_MANIFEST=/work/.minimal/minimal-manifest.txt python3 /work/.github/scripts/audit_multimodal_source.py; \
              python3 /work/.github/scripts/snapshot_vllm_text.py /work/.minimal/replayed'

          diff -qr .minimal/minimal .minimal/replayed
          echo "MINIMAL PATCH REPLAY IS BYTE-IDENTICAL"

      - name: Enforce production-minimal scope
        run: |
          set -euxo pipefail
          minimal_bytes=$(wc -c < .minimal/sm80-cu129-minimal.patch)
          minimal_files=$(grep -c '^+++ b/' .minimal/sm80-cu129-minimal.patch)
          echo "minimal_bytes=$minimal_bytes minimal_files=$minimal_files"
          test "$minimal_files" -eq 25
          test "$(sed -n 's/^changed_files=//p' .minimal/minimal-manifest.txt)" = 25
          ! grep -Eq '^models/deepseek_v4/(amd|cpu|xpu)/|^models/deepseek_v4_1/amd/' .minimal/minimal-manifest.txt
          ! grep -qx 'models/deepseek_v4_1/common/mm_preprocess.py' .minimal/minimal-manifest.txt
          ! grep -qx 'models/deepseek_v4_1/nvidia/vl_model.py' .minimal/minimal-manifest.txt
          ! grep -qx 'models/deepseek_v4/common/vision.py' .minimal/minimal-manifest.txt
          grep -qx 'models/deepseek_v4_1/ampere/ampere_sparse.py' .minimal/minimal-manifest.txt
          grep -qx 'models/deepseek_v4_1/nvidia/model.py' .minimal/minimal-manifest.txt
          grep -qx 'models/deepseek_v4_1/common/engram.py' .minimal/minimal-manifest.txt
          grep -qx 'v1/attention/ops/fp8_sm80.py' .minimal/minimal-manifest.txt
          grep -qx 'v1/attention/ops/mqa_logits_triton.py' .minimal/minimal-manifest.txt

      - name: Publish verified minimal patch
        run: |
          mkdir -p patches/generated
          cp .minimal/sm80-cu129-minimal.patch patches/generated/sm80-cu129-minimal.patch
          awk '{print $1 "  sm80-cu129-minimal.patch"}' \
            .minimal/sm80-cu129-minimal.patch.sha256 \
            > patches/generated/sm80-cu129-minimal.patch.sha256
          cp .minimal/minimal-manifest.txt patches/generated/sm80-cu129-minimal.manifest.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches/generated/sm80-cu129-minimal.patch \
                  patches/generated/sm80-cu129-minimal.patch.sha256 \
                  patches/generated/sm80-cu129-minimal.manifest.txt
          if git diff --cached --quiet; then
            echo "Verified minimal patch is already committed."
          else
            git commit -m "Publish verified minimal DeepSeek V4.1 SM80 cu129 patch"
            git push origin HEAD:minimal-sm80
          fi

      - name: Upload minimal patch candidate
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-v41-sm80-cu129-minimal-candidate
          path: |
            .minimal/sm80-cu129-minimal.patch
            .minimal/sm80-cu129-minimal.patch.sha256
            .minimal/minimal-manifest.txt
          if-no-files-found: error
          retention-days: 7
