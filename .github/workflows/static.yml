name: static-checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          for f in *.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python3 -m py_compile verify_runtime.py patches/apply_overlay.py
      - name: Main CUDA 13 pin sanity
        run: |
          grep -qx 'OFFICIAL_IMAGE=vllm/vllm-openai:deepseekv41-flash-0909' VERSION.env
          grep -qx 'CUDA_FAMILY=13.0.1' VERSION.env
          grep -qx 'SIF_NAME=deepseek-v41-flash-sm80-cu130.sif' VERSION.env
          grep -qx 'From: vllm/vllm-openai:deepseekv41-flash-0909' Singularity.def
          grep -q 'CUDA 13.0.1' Singularity.def
          grep -q '24cb31bb4fd0becee65c810c913a8caa4f610c36' VERSION.env
      - name: SM80 dependency sanity
        run: |
          grep -q 'balanced_row_bounds' patches/apply_overlay.py
          grep -q 'mqa_logits_triton.py' patches/apply_overlay.py
          grep -q 'cutlass_scaled_mm_supports_fp8' patches/apply_overlay.py
          grep -q 'ENABLE_VISION="${ENABLE_VISION:-1}"' serve_tp8_a100.sh
          grep -q -- '--mm-encoder-tp-mode data' serve_tp8_a100.sh
          grep -q 'DISABLE_DSPARK="${DISABLE_DSPARK:-1}"' serve_tp8_a100.sh
