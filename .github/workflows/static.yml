name: static-checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          for f in *.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python3 -m py_compile verify_runtime.py
      - name: Pin sanity
        run: |
          grep -q '24cb31bb4fd0becee65c810c913a8caa4f610c36' VERSION.env
          grep -q 'v0.13.0-sm80' Singularity.def
