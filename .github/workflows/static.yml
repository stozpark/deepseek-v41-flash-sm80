name: static-checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          for f in *.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python3 -m py_compile verify_runtime.py
      - name: CUDA 12.9 pin sanity
        run: |
          grep -q 'CUDA_VERSION=12.9.1' VERSION.env
          grep -q 'cuda12.9' VERSION.env
          grep -q 'torch_cuda_arch_list=8.0' build_docker_cu129.sh
          grep -q 'docker-daemon:' build_sif.sh
