name: audit-production-cu129

on:
  push:
    branches: [cu129]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-cu129-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo docker system prune -af || true
          df -h /
      - name: Verify production pins and patch
        run: |
          grep -qx 'OFFICIAL_IMAGE=vllm/vllm-openai:deepseekv41-flash-0909-cu129' VERSION.env
          grep -qx 'CUDA_FAMILY=12.9.1' VERSION.env
          grep -qx 'From: vllm/vllm-openai:deepseekv41-flash-0909-cu129' Singularity.def
          cd patches/generated
          sha256sum -c sm80-cu129-minimal.patch.sha256
          test "$(sed -n 's/^changed_files=//p' sm80-cu129-minimal.manifest.txt)" = 25
      - name: Pull official DeepSeek V4.1 CUDA 12.9 image
        run: docker pull vllm/vllm-openai:deepseekv41-flash-0909-cu129
      - name: Replay exact production patch and audit
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "$PWD:/work" -w /work \
            vllm/vllm-openai:deepseekv41-flash-0909-cu129 \
            -lc 'set -euxo pipefail; \
              rm -rf /opt/sm80-patch; mkdir -p /opt/sm80-patch; \
              cp /work/patches/generated/sm80-cu129-minimal.patch /opt/sm80-patch/; \
              cp /work/patches/generated/sm80-cu129-minimal.patch.sha256 /opt/sm80-patch/; \
              cp /work/patches/generated/sm80-cu129-minimal.manifest.txt /opt/sm80-patch/; \
              cp /work/patches/apply_minimal_patch.py /opt/sm80-patch/; \
              python3 /opt/sm80-patch/apply_minimal_patch.py; \
              python3 /work/.github/scripts/audit_official_image.py; \
              python3 /work/.github/scripts/audit_multimodal_source.py'
